<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<!-- iOS DESKTOP VARIANT: user-scalable=yes qilib qo'yildi -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>POP-AVTO-MAKON</title>
<style>
:root {
    --red: #e31e24;
    --red-dark: #8a0e12;
    --black: #0a0a0f;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e5e5e5;
    --green: #16a34a;
    --blue: #2563eb;
    --orange: #ea580c;
    --purple: #9333ea;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
}

html, body { min-height: 100vh; }

body {
    color: var(--text);
    padding-bottom: 30px;
    background: var(--black);
    overflow-x: hidden;
}

/* ============ FON ============ */
.bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: 
        radial-gradient(circle at 20% 10%, rgba(227,30,36,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(37,99,235,0.1) 0%, transparent 40%),
        linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 100%);
}
.bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1200&q=80');
    background-size: cover;
    background-position: center;
    opacity: 0.15;
    filter: blur(2px);
}

/* ============ HEADER (DESKTOP) ============ */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 2px solid var(--red);
    padding: 12px 20px;
    box-shadow: 0 4px 25px rgba(227,30,36,0.3);
}

.header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo-svg {
    width: 130px;
    height: auto;
    flex-shrink: 0;
    filter: drop-shadow(0 0 12px rgba(227,30,36,0.4));
    animation: logoGlow 3s ease-in-out infinite alternate;
}

@keyframes logoGlow {
    from { filter: drop-shadow(0 0 8px rgba(227,30,36,0.3)); }
    to { filter: drop-shadow(0 0 18px rgba(227,30,36,0.7)); }
}

.logo-text h1 {
    color: white;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-style: italic;
}
.logo-text h1 span { color: var(--red); }
.logo-text p {
    color: #888;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 2px;
}

.header-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.live-clock {
    color: white;
    font-size: 14px;
    font-weight: 700;
    background: rgba(227,30,36,0.15);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(227,30,36,0.3);
    white-space: nowrap;
}

.live-clock svg {
    width: 14px;
    height: 14px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
    color: var(--red);
}

/* ============ NAV (DESKTOP — gorizontal) ============ */
nav {
    position: sticky;
    top: 76px;
    z-index: 99;
    background: rgba(10,10,15,0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 0 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
}

nav button {
    background: none;
    border: none;
    color: #888;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 18px;
    transition: all 0.25s;
    position: relative;
    white-space: nowrap;
    flex-shrink: 0;
}
nav button svg {
    width: 18px;
    height: 18px;
    stroke-width: 2;
    transition: all 0.25s;
}
nav button.active {
    color: var(--red);
}
nav button.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 12px;
    right: 12px;
    height: 3px;
    background: var(--red);
    border-radius: 3px 3px 0 0;
    box-shadow: 0 0 8px var(--red);
}
nav button:active { transform: scale(0.97); }

/* ============ SECTION (DESKTOP GRID) ============ */
.section {
    display: none;
    padding: 24px 20px;
    max-width: 1100px;
    margin: 0 auto;
    animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.section.active { display: block; }
@keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Desktop grid layout */
.grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}

.grid-3 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
}

.grid-4 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
}

.grid-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
}

.grid-form .field.full {
    grid-column: 1 / -1;
}

/* ============ TYPOGRAPHY ============ */
h2 {
    color: white;
    font-size: 17px;
    font-weight: 800;
    margin: 24px 0 14px;
    padding-left: 12px;
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
}
h2:first-child { margin-top: 0; }
h2::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    background: var(--red);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--red);
}
h2 svg { width: 20px; height: 20px; color: var(--red); }

/* ============ CARD ============ */
.card {
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
}

/* ============ INPUT ============ */
.field {
    margin-bottom: 14px;
}
.field label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #444;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}
.field label svg { width: 14px; height: 14px; color: var(--red); }
.field input,
.field select,
.field textarea {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
}
.field select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e31e24' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
    padding-right: 40px;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(227,30,36,0.12);
}

/* ============ BUTTON ============ */
.btn {
    width: 100%;
    min-height: 50px;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    color: white;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(227,30,36,0.4);
    letter-spacing: 0.3px;
    margin-top: 8px;
}
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: scale(0.97); }
.btn.black { background: linear-gradient(135deg, #2a2a2a, #000); box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
.btn.green { background: linear-gradient(135deg, #16a34a, #15803d); box-shadow: 0 4px 15px rgba(22,163,74,0.4); }
.btn.blue { background: linear-gradient(135deg, #2563eb, #1e40af); box-shadow: 0 4px 15px rgba(37,99,235,0.4); }
.btn.orange { background: linear-gradient(135deg, #ea580c, #c2410c); box-shadow: 0 4px 15px rgba(234,88,12,0.4); }
.btn.gray { background: linear-gradient(135deg, #6b7280, #374151); box-shadow: 0 4px 15px rgba(107,114,128,0.4); }

/* ============ ITEM LIST ============ */
.item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #f0f0f0;
}
.item:last-child { border-bottom: none; }
.item-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
}
.item-icon svg { width: 22px; height: 22px; }
.item-icon.green { background: linear-gradient(135deg, #16a34a, #15803d); }
.item-icon.blue { background: linear-gradient(135deg, #2563eb, #1e40af); }
.item-icon.orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
.item-icon.purple { background: linear-gradient(135deg, #9333ea, #6b21a8); }
.item-body { flex: 1; min-width: 0; }
.item-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 3px;
}
.item-sub {
    font-size: 13px;
    color: var(--muted);
    margin-top: 2px;
}
.item-price {
    font-size: 15px;
    font-weight: 800;
    color: var(--red);
    margin-top: 3px;
}
.item-del {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(227,30,36,0.08);
    border: none;
    color: var(--red);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
}
.item-del svg { width: 16px; height: 16px; }
.item-del:active { background: rgba(227,30,36,0.25); }

/* ============ CHECKBOX ============ */
.check {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px;
    border: 2px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    cursor: pointer;
    background: #fff;
    transition: all 0.2s;
}
.check.on {
    border-color: var(--red);
    background: linear-gradient(135deg, #fff, #fff5f5);
    box-shadow: 0 0 0 3px rgba(227,30,36,0.1);
}
.check-box {
    width: 26px;
    height: 26px;
    border: 2px solid var(--border);
    border-radius: 7px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all 0.2s;
    background: #fff;
}
.check.on .check-box {
    background: var(--red);
    border-color: var(--red);
}
.check-box svg {
    width: 15px;
    height: 15px;
    color: white;
    opacity: 0;
    transition: opacity 0.2s;
}
.check.on .check-box svg { opacity: 1; }
.check-body { flex: 1; min-width: 0; }
.check-title { font-size: 15px; font-weight: 700; }
.check-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 5px;
    font-size: 13px;
    color: var(--muted);
    flex-wrap: wrap;
}
.check-price {
    color: var(--red);
    font-weight: 800;
}
.check-usta {
    color: var(--blue);
    font-weight: 600;
}

/* ============ RESULT ============ */
.result {
    background: linear-gradient(135deg, #1a1a2e, #0a0a0f);
    color: white;
    padding: 24px;
    border-radius: 14px;
    margin-top: 20px;
    border: 2px solid var(--red);
    box-shadow: 0 0 40px rgba(227,30,36,0.4);
    animation: pop 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}
@keyframes pop {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
}
.result-title {
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 16px;
    text-transform: uppercase;
}
.result-info {
    background: rgba(255,255,255,0.05);
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 14px;
    font-size: 14px;
}
.result-info div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: #ccc;
}
.result-info div:last-child { margin-bottom: 0; }
.result-info strong { color: white; }
.result-list {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding-top: 14px;
    margin-top: 14px;
}
.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    font-size: 15px;
}
.result-row span:first-child { color: #ccc; }
.result-row span:last-child { color: white; font-weight: 600; }
.result-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    margin-top: 12px;
    border-top: 2px solid var(--red);
    font-size: 22px;
    font-weight: 900;
}
.result-total span:last-child { color: var(--red); }
.result-share {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
}
.share-box {
    padding: 14px;
    border-radius: 10px;
    text-align: center;
}
.share-box.m { background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3); }
.share-box.u { background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.3); }
.share-label { font-size: 11px; color: #888; letter-spacing: 0.5px; margin-bottom: 5px; }
.share-value { font-size: 18px; font-weight: 900; }
.share-box.m .share-value { color: #60a5fa; }
.share-box.u .share-value { color: #4ade80; }

/* ============ STATS ============ */
.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 16px;
}
.stat {
    padding: 18px;
    border-radius: 14px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.stat::before {
    content: '';
    position: absolute;
    top: -50%;
    right: -30%;
    width: 130px;
    height: 130px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
}
.stat-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.9;
    text-transform: uppercase;
    position: relative;
}
.stat-value {
    font-size: 22px;
    font-weight: 900;
    margin-top: 8px;
    position: relative;
    word-break: break-all;
}
.stat-sub {
    font-size: 12px;
    opacity: 0.85;
    margin-top: 4px;
    position: relative;
}
.stat.red { background: linear-gradient(135deg, #e31e24, #8a0e12); }
.stat.green { background: linear-gradient(135deg, #16a34a, #15803d); }
.stat.blue { background: linear-gradient(135deg, #2563eb, #1e40af); }
.stat.orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
.stat.purple { background: linear-gradient(135deg, #9333ea, #6b21a8); }
.stat.dark { background: linear-gradient(135deg, #374151, #1f2937); }

/* ============ EMPTY ============ */
.empty {
    text-align: center;
    padding: 50px 20px;
    color: #999;
    font-size: 14px;
}
.empty svg {
    width: 56px;
    height: 56px;
    stroke-width: 1.5;
    color: #ccc;
    margin-bottom: 12px;
}

/* ============ TOAST ============ */
.toast {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(22,163,74,0.5);
    z-index: 9999;
    opacity: 0;
    transition: all 0.35s;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
}
.toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
}
.toast.error { background: linear-gradient(135deg, #e31e24, #8a0e12); box-shadow: 0 10px 30px rgba(227,30,36,0.5); }

/* ============ MODAL ============ */
.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
    background: white;
    border-radius: 18px;
    padding: 24px;
    max-width: 460px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalIn 0.3s;
}
@keyframes modalIn {
    from { opacity: 0; transform: scale(0.9) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
}
.modal-title {
    font-size: 18px;
    font-weight: 900;
    color: var(--text);
    text-align: center;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.modal-title svg { width: 20px; height: 20px; color: var(--red); }
.sms-preview {
    background: #f5f5f5;
    padding: 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    color: #333;
    white-space: pre-line;
    border-left: 4px solid var(--red);
    font-weight: 500;
    margin-bottom: 14px;
}
.modal-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}
.modal-actions .btn { margin-top: 0; }

/* ============ SECTION HEADER ============ */
.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 24px 0 14px;
}
.section-head h2 { margin: 0; }
.badge {
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(227,30,36,0.15);
    color: var(--red);
    font-size: 12px;
    font-weight: 800;
}

/* ============ TABS ============ */
.tabs {
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 16px;
}
.tabs button {
    flex: 1;
    padding: 11px;
    border: none;
    background: transparent;
    color: #888;
    font-size: 14px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.tabs button.active {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: white;
    box-shadow: 0 4px 12px rgba(227,30,36,0.4);
}

/* ============ iOS SPECIFIC ============ */
@supports (-webkit-touch-callout: none) {
    /* iPhone-specific adjustments */
    .section {
        padding-left: max(20px, env(safe-area-inset-left));
        padding-right: max(20px, env(safe-area-inset-right));
    }
    header { padding-top: max(12px, env(safe-area-inset-top)); }
}

/* ============ SMALL SCREEN (iPhone portrait) ============ */
@media (max-width: 768px) {
    /* Desktop layoutni saqlab qolish — faqat scale kichraytiradi */
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr; }
    .grid-4 { grid-template-columns: 1fr 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .grid-form { grid-template-columns: 1fr; }
    
    .header-inner {
        flex-wrap: wrap;
    }
    
    .logo-svg { width: 100px; }
    .logo-text h1 { font-size: 15px; }
    
    .live-clock {
        font-size: 12px;
        padding: 6px 12px;
    }
    
    nav { top: 68px; }
    nav button {
        font-size: 12px;
        padding: 12px 14px;
    }
    nav button svg { width: 16px; height: 16px; }
}

/* ============ VERY SMALL SCREEN ============ */

<script>
/* ============ DATA ============ */
let ustalar = JSON.parse(localStorage.getItem('pam_ustalar')) || [];
let services = JSON.parse(localStorage.getItem('pam_services')) || [];
let orders = JSON.parse(localStorage.getItem('pam_orders')) || [];
let specs = JSON.parse(localStorage.getItem('pam_specs')) || [
    "MOTOR", "XODOVOY", "KUZOV", "VAKUM",
    "ELEKTRIK", "DIAGNOSTIKA", "MEXANIK", "BOSHQA"
];
let period = 'month';
let lastSms = null;

const $ = id => document.getElementById(id);
const money = n => Math.round(n).toLocaleString('uz-UZ');

function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

/* ============ LIVE CLOCK ============ */
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const el = $('clockText');
    if (el) el.textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);

/* ============ NAV ============ */
function go(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    $(id).classList.add('active');
    btn.classList.add('active');
    
    if (id === 's-panel') renderDash();
    if (id === 's-ustalar') { renderUstalar(); renderUstaSpecSelect(); }
    if (id === 's-xizmatlar') { renderSvcs(); renderSvcUstaSelect(); }
    if (id === 's-order') { renderOrderChecks(); renderSvcUstaSelect(); }
    if (id === 's-history') renderHistory();
    
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderUstaSpecSelect() {
    $('ustaSpec').innerHTML = '<option value="">Mutaxassislikni tanlang</option>' +
        specs.map(s => `<option value="${s}">${s}</option>`).join('');
}

/* ============ USTALAR ============ */
function addUsta() {
    const name = $('ustaName').value.trim();
    const spec = $('ustaSpec').value;
    const work = $('ustaWork').value.trim();
    const rate = $('ustaRate').value;
    
    if (!name) return toast('Usta ismini kiriting', true);
    if (!spec) return toast('Mutaxassislikni tanlang', true);
    
    ustalar.push({ id: Date.now(), name, spec, work: work || spec, rate: Number(rate) || 0 });
    localStorage.setItem('pam_ustalar', JSON.stringify(ustalar));
    
    $('ustaName').value = '';
    $('ustaSpec').value = '';
    $('ustaWork').value = '';
    $('ustaRate').value = '';
    
    renderUstalar();
    renderSvcUstaSelect();
    toast('Usta qo\'shildi');
}

function delUsta(id) {
    if (!confirm('Ustani o\'chirmoqchimisiz?')) return;
    ustalar = ustalar.filter(u => u.id !== id);
    localStorage.setItem('pam_ustalar', JSON.stringify(ustalar));
    renderUstalar();
    renderSvcUstaSelect();
    toast('O\'chirildi');
}

function renderUstalar() {
    const el = $('ustalarList');
    $('ustalarCount').textContent = ustalar.length + ' ta';
    
    if (ustalar.length === 0) {
        el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div>Ustalar yo\'q</div></div>';
        return;
    }
    
    el.innerHTML = ustalar.map(u => `
        <div class="item">
            <div class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="item-body">
                <div class="item-title">${u.name}</div>
                <div class="item-sub">${u.spec} • ${u.work}</div>
                ${u.rate ? `<div class="item-price">${money(u.rate)} so'm</div>` : ''}
            </div>
            <button class="item-del" onclick="delUsta(${u.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    `).join('');
}

/* ============ XIZMATLAR ============ */
function renderSvcUstaSelect() {
    const el = $('svcUsta');
    if (!el) return;
    el.innerHTML = '<option value="">Ustani tanlang</option>' +
        ustalar.map(u => `<option value="${u.name} (${u.spec})">${u.name} — ${u.spec}</option>`).join('');
}

function addSvc() {
    const name = $('svcName').value.trim();
    const price = $('svcPrice').value;
    const usta = $('svcUsta').value;
    
    if (!name) return toast('Xizmat nomini kiriting', true);
    if (!price) return toast('Xizmat narxini kiriting', true);
    
    services.push({ id: Date.now(), name, price: Number(price), usta: usta || 'Belgilanmagan' });
    localStorage.setItem('pam_services', JSON.stringify(services));
    
    $('svcName').value = '';
    $('svcPrice').value = '';
    $('svcUsta').value = '';
    
    renderSvcs();
    renderOrderChecks();
    toast('Xizmat qo\'shildi');
}

function delSvc(id) {
    if (!confirm('Xizmatni o\'chirmoqchimisiz?')) return;
    services = services.filter(s => s.id !== id);
    localStorage.setItem('pam_services', JSON.stringify(services));
    renderSvcs();
    renderOrderChecks();
    toast('O\'chirildi');
}

function renderSvcs() {
    const el = $('svcsList');
    $('svcsCount').textContent = services.length + ' ta';
    
    if (services.length === 0) {
        el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg><div>Xizmatlar yo\'q</div></div>';
        return;
    }
    
    el.innerHTML = services.map(s => `
        <div class="item">
            <div class="item-icon green">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            </div>
            <div class="item-body">
                <div class="item-title">${s.name}</div>
                <div class="item-price">${money(s.price)} so'm</div>
                <div class="item-sub">${s.usta}</div>
            </div>
            <button class="item-del" onclick="delSvc(${s.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    `).join('');
}

/* ============ BUYURTMA ============ */
function renderOrderChecks() {
    const el = $('orderChecks');
    if (services.length === 0) {
        el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H3v10h6zM21 3h-6v18h6zM15 7H9v14h6z"/></svg><div>Xizmatlar yo\'q</div></div>';
        return;
    }
    
    el.innerHTML = services.map(s => `
        <label class="check" onclick="toggleCheck(this)">
            <div class="check-box">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <input type="checkbox" value="${s.id}" data-price="${s.price}" data-name="${s.name}" data-usta="${s.usta}" style="display:none">
            <div class="check-body">
                <div class="check-title">${s.name}</div>
                <div class="check-meta">
                    <span class="check-price">${money(s.price)} so'm</span>
                    <span class="check-usta">${s.usta}</span>
                </div>
            </div>
        </label>
    `).join('');
}

function toggleCheck(label) {
    const cb = label.querySelector('input[type="checkbox"]');
    cb.checked = !cb.checked;
    label.classList.toggle('on', cb.checked);
}

function calcOrder() {
    const name = $('oName').value.trim();
    const phone = $('oPhone').value.trim();
    const model = $('oModel').value.trim();
    const number = $('oNumber').value.trim();
    
    const checked = document.querySelectorAll('#orderChecks input:checked');
    if (checked.length === 0) return toast('Xizmat tanlang', true);
    
    let total = 0;
    let items = [];
    checked.forEach(cb => {
        const p = Number(cb.dataset.price);
        const n = cb.dataset.name;
        const u = cb.dataset.usta;
        total += p;
        items.push({ name: n, price: p, usta: u });
    });
    
    const mgr = total * 0.30;
    const ust = total * 0.70;
    
    const el = $('orderResult');
    el.innerHTML = `
        <div class="result">
            <div class="result-title">Hisob-kitob</div>
            <div class="result-info">
                <div><span>Mijoz</span><strong>${name || 'Noma\'lum'}</strong></div>
                <div><span>Telefon</span><strong>${phone || 'Noma\'lum'}</strong></div>
                <div><span>Mashina</span><strong>${model || 'Noma\'lum'}</strong></div>
                <div><span>Raqam</span><strong>${number || 'Noma\'lum'}</strong></div>
            </div>
            <div class="result-list">
                ${items.map(i => `
                    <div class="result-row">
                        <span>${i.name} <small style="color:#60a5fa">(${i.usta})</small></span>
                        <span>${money(i.price)}</span>
                    </div>
                `).join('')}
            </div>
            <div class="result-total">
                <span>JAMI</span>
                <span>${money(total)} so'm</span>
            </div>
            <div class="result-share">
                <div class="share-box m">
                    <div class="share-label">MENEJER 30%</div>
                    <div class="share-value">${money(mgr)}</div>
                </div>
                <div class="share-box u">
                    <div class="share-label">USTALAR 70%</div>
                    <div class="share-value">${money(ust)}</div>
                </div>
            </div>
            <button class="btn green" style="margin-top:14px" onclick='saveOrder(${JSON.stringify({name, phone, model, number, total, mgr, ust, items}).replace(/'/g, "&#39;")})'>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                Saqlash va SMS yuborish
            </button>
        </div>
    `;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function saveOrder(data) {
    const now = new Date();
    const order = {
        id: Date.now(),
        date: now.toLocaleString('uz-UZ'),
        dateStr: now.toISOString().split('T')[0],
        ...data
    };
    orders.unshift(order);
    localStorage.setItem('pam_orders', JSON.stringify(orders));
    
    const smsText = `XURMATLI ${data.name.toUpperCase() || 'MIJOZ'}!\n\nSIZNING ${data.number || ''} ${data.model.toUpperCase() || ''} RUSUMLI AVTOMASHINANGIZGA QILINGAN XIZMATLAR ${money(data.total)} SO'M BOLDI.\n\nXIZMATIMIZDAN FOYDALANGANINGIZ UCHUN MINNATDORMIZ!`;
    
    lastSms = { phone: data.phone, text: smsText };
    $('smsTo').textContent = data.name || 'Mijoz';
    $('smsPhone').textContent = data.phone || '—';
    $('smsText').textContent = smsText;
    $('smsModal').classList.add('show');
    
    $('oName').value = '';
    $('oPhone').value = '';
    $('oModel').value = '';
    $('oNumber').value = '';
    document.querySelectorAll('#orderChecks input').forEach(cb => {
        cb.checked = false;
        cb.closest('.check').classList.remove('on');
    });
    $('orderResult').innerHTML = '';
}

/* ============ SMS ============ */
function closeSms() {
    $('smsModal').classList.remove('show');
}

function sendSms() {
    if (!lastSms) return;
    const clean = lastSms.phone.replace(/[^\d+]/g, '');
    window.location.href = `sms:${clean}?body=${encodeURIComponent(lastSms.text)}`;
    toast('SMS ilovasi ochilmoqda...');
    setTimeout(() => {
        closeSms();
        go('s-history', document.querySelectorAll('nav button')[4]);
    }, 700);
}

/* ============ PANEL ============ */
function setPeriod(p) {
    period = p;
    ['today', 'week', 'month', 'all'].forEach(x => {
        $('p-' + x).classList.toggle('active', x === p);
    });
    renderDash();
}

function getFiltered() {
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];
    
    if (period === 'today') return orders.filter(o => o.dateStr === todayStr);
    if (period === 'week') {
        const d = new Date(today);
        d.setDate(d.getDate() - 7);
        return orders.filter(o => o.dateStr >= d.toISOString().split('T')[0]);
    }
    if (period === 'month') {
        const d = new Date(today);
        d.setDate(d.getDate() - 30);
        return orders.filter(o => o.dateStr >= d.toISOString().split('T')[0]);
    }
    return orders;
}

function renderDash() {
    const f = getFiltered();
    const total = f.reduce((s, o) => s + o.total, 0);
    const mgr = f.reduce((s, o) => s + o.mgr, 0);
    const ust = f.reduce((s, o) => s + o.ust, 0);
    
    const periodNames = { today: 'Bugun', week: 'Oxirgi 7 kun', month: 'Oxirgi 30 kun', all: 'Barcha vaqt' };
    $('periodText').textContent = periodNames[period];
    
    $('dashStats').innerHTML = `
        <div class="stats">
            <div class="stat red">
                <div class="stat-label">Umumiy tushum</div>
                <div class="stat-value">${money(total)}</div>
                <div class="stat-sub">so'm</div>
            </div>
            <div class="stat dark">
                <div class="stat-label">Buyurtmalar</div>
                <div class="stat-value">${f.length}</div>
                <div class="stat-sub">ta</div>
            </div>
            <div class="stat blue">
                <div class="stat-label">Menejer 30%</div>
                <div class="stat-value">${money(mgr)}</div>
                <div class="stat-sub">so'm</div>
            </div>
            <div class="stat green">
                <div class="stat-label">Ustalar 70%</div>
                <div class="stat-value">${money(ust)}</div>
                <div class="stat-sub">so'm</div>
            </div>
        </div>
    `;
    
    const specMap = {};
    f.forEach(o => o.items.forEach(i => {
        const found = ustalar.find(u => i.usta.includes(u.name));
        const spec = found ? found.spec : 'BOSHQA';
        if (!specMap[spec]) specMap[spec] = { count: 0, total: 0 };
        specMap[spec].count++;
        specMap[spec].total += i.price;
    }));
    
    const entries = Object.entries(specMap).sort((a, b) => b[1].total - a[1].total);
    
    if (entries.length === 0) {
        $('dashSpecs').innerHTML = '<div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11H3v10h6zM21 3h-6v18h6zM15 7H9v14h6z"/></svg><div>Ma\'lumot yo\'q</div></div></div>';
        return;
    }
    
    $('dashSpecs').innerHTML = '<h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>Mutaxassislik bo\'yicha</h2>' +
        '<div class="grid-2">' +
        entries.map(([spec, d]) => {
            const pct = total > 0 ? (d.total / total * 100).toFixed(1) : 0;
            return `
                <div class="card" style="border-left:4px solid var(--red); padding:16px; margin-bottom:0;">
                    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
                        <div style="flex:1;">
                            <div style="font-weight:800; font-size:15px; color:var(--text);">${spec}</div>
                            <div style="font-size:12px; color:var(--muted); margin-top:3px;">${d.count} ta xizmat • ${pct}%</div>
                        </div>
                        <div style="text-align:right;">
                            <div style="color:var(--red); font-weight:900; font-size:16px;">${money(d.total)}</div>
                            <div style="font-size:11px; color:var(--muted);">so'm</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('') +
        '</div>';
}

/* ============ TARIX ============ */
function renderHistory() {
    const el = $('historyList');
    if (orders.length === 0) {
        el.innerHTML = '<div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg><div>Buyurtmalar yo\'q</div></div></div>';
        return;
    }
    
    el.innerHTML = '<div class="grid-2">' + orders.map(o => `
        <div class="card" style="border-left:4px solid var(--red); margin-bottom:0;">
            <div style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;">
                <div style="flex:1; min-width:0;">
                    <div style="font-weight:800; font-size:15px;">${o.name || 'Noma\'lum'}</div>
                    <div style="font-size:12px; color:var(--muted); margin-top:3px;">${o.phone || '—'}</div>
                    <div style="font-size:12px; color:var(--muted); margin-top:2px;">${o.model || '—'} — ${o.number || '—'}</div>
                    <div style="font-size:11px; color:#999; margin-top:4px;">${o.date}</div>
                </div>
                <div style="display:flex; flex-direction:column; gap:5px;">
                    <button class="item-del" style="background:rgba(22,163,74,0.1); color:var(--green);" onclick='resendSms(${o.id})'>
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                    </button>
                    <button class="item-del" onclick="delOrder(${o.id})">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                    </button>
                </div>
            </div>
            <div style="font-size:12px; color:var(--muted); margin-bottom:8px;">
                ${o.items.map(i => i.name).join(', ')}
            </div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:1px solid #eee;">
                <div style="font-size:11px; color:var(--muted);">
                    Menejer: <strong style="color:#2563eb;">${money(o.mgr)}</strong>
                </div>
                <div style="color:var(--red); font-weight:900; font-size:16px;">${money(o.total)} so'm</div>
            </div>
        </div>
    `).join('') + '</div>';
}

function delOrder(id) {
    if (!confirm('O\'chirmoqchimisiz?')) return;
    orders = orders.filter(o => o.id !== id);
    localStorage.setItem('pam_orders', JSON.stringify(orders));
    renderHistory();
    toast('O\'chirildi');
}

function resendSms(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const smsText = `XURMATLI ${o.name.toUpperCase() || 'MIJOZ'}!\n\nSIZNING ${o.number || ''} ${o.model.toUpperCase() || ''} RUSUMLI AVTOMASHINANGIZGA QILINGAN XIZMATLAR ${money(o.total)} SO'M BOLDI.\n\nXIZMATIMIZDAN FOYDALANGANINGIZ UCHUN MINNATDORMIZ!`;
    lastSms = { phone: o.phone, text: smsText };
    $('smsTo').textContent = o.name || 'Mijoz';
    $('smsPhone').textContent = o.phone || '—';
    $('smsText').textContent = smsText;
    $('smsModal').classList.add('show');
}

/* ============ INIT ============ */
document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - (window._lastTap || 0) <= 300) e.preventDefault();
    window._lastTap = now;
}, { passive: false });

window.onload = () => {
    updateClock();
    renderUstaSpecSelect();
    renderUstalar();
    renderSvcs();
    renderSvcUstaSelect();
    renderOrderChecks();
    renderHistory();
    renderDash();
};
</script>

</body>
</html>
