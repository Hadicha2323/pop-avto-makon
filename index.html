<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PAM">
<meta name="application-name" content="POP AVTO MAKON">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="POP AVTO MAKON - Автосервис хизматларини автоматлаштириш тизими">

<link rel="icon" type="image/svg+xml" sizes="192x192" href="icon-192.svg">
<link rel="icon" type="image/svg+xml" sizes="512x512" href="icon-512.svg">
<link rel="apple-touch-icon" href="icon-192.svg">
<link rel="manifest" href="manifest.json">

<title>POP-AVTO-MAKON</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.js"></script>

<style>
:root {
    --red: #e31e24;
    --red-dark: #8a0e12;
    --black: #0a0a0f;
    --text: #1a1a1a;
    --muted: #666;
    --border: #e5e5e5;
    --green: #16a34a;
    --blue: #2563eb;
    --orange: #ea580c;
    --purple: #9333ea;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
}

html, body { min-height: 100vh; }

body {
    color: var(--text);
    padding-bottom: 30px;
    background: var(--black);
    overflow-x: hidden;
}

.bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: 
        radial-gradient(circle at 20% 10%, rgba(227,30,36,0.15) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(37,99,235,0.1) 0%, transparent 40%),
        linear-gradient(180deg, #0a0a0f 0%, #1a1a2e 100%);
}
.bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?w=1200&q=80');
    background-size: cover;
    background-position: center;
    opacity: 0.15;
    filter: blur(2px);
}

/* HEADER */
header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,15,0.95);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 2px solid var(--red);
    padding: 12px 20px;
    box-shadow: 0 4px 25px rgba(227,30,36,0.3);
}

.header-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
}

.logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
}

/* ЛОГОТИП ОҚ ФОНЛИ КАРТОЧКАДА */
.logo-box {
    background: #ffffff;
    border-radius: 12px;
    padding: 6px 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 2px rgba(227,30,36,0.3);
    animation: logoBoxGlow 3s ease-in-out infinite alternate;
}

@keyframes logoBoxGlow {
    from { box-shadow: 0 4px 20px rgba(0,0,0,0.4), 0 0 0 2px rgba(227,30,36,0.3); }
    to { box-shadow: 0 4px 25px rgba(0,0,0,0.5), 0 0 0 2px rgba(227,30,36,0.7), 0 0 20px rgba(227,30,36,0.4); }
}

.logo-svg {
    width: 120px;
    height: auto;
    display: block;
}

.logo-text h1 {
    color: white;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.5px;
    font-style: italic;
}
.logo-text h1 span { color: var(--red); }
.logo-text p {
    color: #888;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 2px;
}

.header-info {
    display: flex;
    align-items: center;
    gap: 15px;
}

.live-clock {
    color: white;
    font-size: 14px;
    font-weight: 700;
    background: rgba(227,30,36,0.15);
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(227,30,36,0.3);
    white-space: nowrap;
}

.live-clock svg {
    width: 14px;
    height: 14px;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
    color: var(--red);
}

.sync-status {
    font-size: 11px;
    color: #888;
    background: rgba(255,255,255,0.05);
    padding: 6px 12px;
    border-radius: 15px;
    white-space: nowrap;
}
.sync-status.ok { color: #4ade80; }
.sync-status.loading { color: #facc15; }
.sync-status.err { color: #f87171; }

/* NAV */
nav {
    position: sticky;
    top: 76px;
    z-index: 99;
    background: rgba(10,10,15,0.98);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    padding: 0 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
}

.nav-inner {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    gap: 4px;
}

nav button {
    background: none;
    border: none;
    color: #888;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 14px 18px;
    transition: all 0.25s;
    position: relative;
    white-space: nowrap;
    flex-shrink: 0;
}
nav button svg {
    width: 18px;
    height: 18px;
    stroke-width: 2;
    transition: all 0.25s;
}
nav button.active { color: var(--red); }
nav button.active::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 12px;
    right: 12px;
    height: 3px;
    background: var(--red);
    border-radius: 3px 3px 0 0;
    box-shadow: 0 0 8px var(--red);
}
nav button:active { transform: scale(0.97); }

/* SECTION */
.section {
    display: none;
    padding: 24px 20px;
    max-width: 1100px;
    margin: 0 auto;
    animation: slideIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}
.section.active { display: block; }
@keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }
.grid-form .field.full { grid-column: 1 / -1; }

h2 {
    color: white;
    font-size: 17px;
    font-weight: 800;
    margin: 24px 0 14px;
    padding-left: 12px;
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
}
h2:first-child { margin-top: 0; }
h2::before {
    content: '';
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 3px;
    height: 20px;
    background: var(--red);
    border-radius: 2px;
    box-shadow: 0 0 8px var(--red);
}
h2 svg { width: 20px; height: 20px; color: var(--red); }

.card {
    background: rgba(255,255,255,0.98);
    backdrop-filter: blur(20px);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    border: 1px solid rgba(255,255,255,0.1);
}

.field { margin-bottom: 14px; }
.field label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    color: #444;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}
.field label svg { width: 14px; height: 14px; color: var(--red); }
.field input, .field select {
    width: 100%;
    padding: 13px 14px;
    border: 2px solid var(--border);
    border-radius: 10px;
    font-size: 15px;
    font-weight: 500;
    background: #fff;
    color: var(--text);
    outline: none;
    transition: all 0.2s;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
}
.field select {
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e31e24' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 14px center;
    background-size: 16px;
    padding-right: 40px;
}
.field input:focus, .field select:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(227,30,36,0.12);
}

.search-box {
    position: relative;
    margin-bottom: 14px;
}
.search-box input {
    width: 100%;
    padding: 14px 16px 14px 45px;
    border: 2px solid rgba(227,30,36,0.2);
    border-radius: 12px;
    font-size: 15px;
    outline: none;
    background: rgba(255,255,255,0.98);
    color: var(--text);
    font-weight: 500;
}
.search-box input:focus {
    border-color: var(--red);
    box-shadow: 0 0 0 4px rgba(227,30,36,0.15);
}
.search-box::before {
    content: '🔍';
    position: absolute;
    left: 15px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    z-index: 1;
}

.btn {
    width: 100%;
    min-height: 50px;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 800;
    color: white;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: all 0.2s;
    box-shadow: 0 4px 15px rgba(227,30,36,0.4);
    letter-spacing: 0.3px;
    margin-top: 8px;
}
.btn svg { width: 18px; height: 18px; }
.btn:active { transform: scale(0.97); }
.btn.black { background: linear-gradient(135deg, #2a2a2a, #000); }
.btn.green { background: linear-gradient(135deg, #16a34a, #15803d); }
.btn.blue { background: linear-gradient(135deg, #2563eb, #1e40af); }
.btn.orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
.btn.gray { background: linear-gradient(135deg, #6b7280, #374151); }

.item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid #f0f0f0;
}
.item:last-child { border-bottom: none; }
.item-icon {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    flex-shrink: 0;
    background: linear-gradient(135deg, var(--red), var(--red-dark));
}
.item-icon svg { width: 22px; height: 22px; }
.item-icon.blue { background: linear-gradient(135deg, #2563eb, #1e40af); }
.item-body { flex: 1; min-width: 0; }
.item-title { font-size: 16px; font-weight: 700; margin-bottom: 3px; }
.item-sub { font-size: 13px; color: var(--muted); margin-top: 2px; }
.item-price { font-size: 15px; font-weight: 800; color: var(--red); margin-top: 3px; }
.item-del {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: rgba(227,30,36,0.08);
    border: none;
    color: var(--red);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}
.item-del svg { width: 16px; height: 16px; }
.item-del:active { background: rgba(227,30,36,0.25); }

.result {
    background: linear-gradient(135deg, #1a1a2e, #0a0a0f);
    color: white;
    padding: 24px;
    border-radius: 14px;
    margin-top: 20px;
    border: 2px solid var(--red);
    box-shadow: 0 0 40px rgba(227,30,36,0.4);
}
.result-title {
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 1px;
    color: #888;
    margin-bottom: 16px;
    text-transform: uppercase;
}
.result-info {
    background: rgba(255,255,255,0.05);
    padding: 14px;
    border-radius: 10px;
    margin-bottom: 14px;
    font-size: 14px;
}
.result-info div {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    color: #ccc;
}
.result-info div:last-child { margin-bottom: 0; }
.result-info strong { color: white; }
.result-total {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    margin-top: 12px;
    border-top: 2px solid var(--red);
    font-size: 22px;
    font-weight: 900;
}
.result-total span:last-child { color: var(--red); }
.result-share { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
.share-box { padding: 14px; border-radius: 10px; text-align: center; }
.share-box.m { background: rgba(37,99,235,0.15); border: 1px solid rgba(37,99,235,0.3); }
.share-box.u { background: rgba(22,163,74,0.15); border: 1px solid rgba(22,163,74,0.3); }
.share-label { font-size: 11px; color: #888; letter-spacing: 0.5px; margin-bottom: 5px; }
.share-value { font-size: 18px; font-weight: 900; }
.share-box.m .share-value { color: #60a5fa; }
.share-box.u .share-value { color: #4ade80; }

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    margin-bottom: 16px;
}
.stat {
    padding: 18px;
    border-radius: 14px;
    color: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
}
.stat::before {
    content: '';
    position: absolute;
    top: -50%; right: -30%;
    width: 130px; height: 130px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
}
.stat-label { font-size: 11px; font-weight: 700; letter-spacing: 1px; opacity: 0.9; text-transform: uppercase; position: relative; }
.stat-value { font-size: 22px; font-weight: 900; margin-top: 8px; position: relative; word-break: break-all; }
.stat-sub { font-size: 12px; opacity: 0.85; margin-top: 4px; position: relative; }
.stat.red { background: linear-gradient(135deg, #e31e24, #8a0e12); }
.stat.green { background: linear-gradient(135deg, #16a34a, #15803d); }
.stat.blue { background: linear-gradient(135deg, #2563eb, #1e40af); }
.stat.orange { background: linear-gradient(135deg, #ea580c, #c2410c); }
.stat.dark { background: linear-gradient(135deg, #374151, #1f2937); }
.stat.purple { background: linear-gradient(135deg, #9333ea, #6b21a8); }

.empty { text-align: center; padding: 50px 20px; color: #999; font-size: 14px; }
.empty svg { width: 56px; height: 56px; stroke-width: 1.5; color: #ccc; margin-bottom: 12px; }

.toast {
    position: fixed;
    top: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: white;
    padding: 14px 28px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(22,163,74,0.5);
    z-index: 9999;
    opacity: 0;
    transition: all 0.35s;
    pointer-events: none;
    max-width: 90vw;
    text-align: center;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.error { background: linear-gradient(135deg, #e31e24, #8a0e12); }

.modal-bg {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
}
.modal-bg.show { display: flex; }
.modal {
    background: white;
    border-radius: 18px;
    padding: 24px;
    max-width: 460px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
}
.modal-title {
    font-size: 18px;
    font-weight: 900;
    text-align: center;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}
.modal-title svg { width: 20px; height: 20px; color: var(--red); }
.sms-preview {
    background: #f5f5f5;
    padding: 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    color: #333;
    white-space: pre-line;
    border-left: 4px solid var(--red);
    margin-bottom: 14px;
}
.modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-actions .btn { margin-top: 0; }

.section-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: 24px 0 14px;
}
.section-head h2 { margin: 0; }
.badge {
    padding: 5px 14px;
    border-radius: 20px;
    background: rgba(227,30,36,0.15);
    color: var(--red);
    font-size: 12px;
    font-weight: 800;
}

.tabs {
    display: flex;
    gap: 8px;
    background: rgba(255,255,255,0.05);
    padding: 5px;
    border-radius: 12px;
    margin-bottom: 16px;
    flex-wrap: wrap;
}
.tabs button {
    flex: 1;
    min-width: 80px;
    padding: 11px;
    border: none;
    background: transparent;
    color: #888;
    font-size: 14px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.tabs button.active {
    background: linear-gradient(135deg, var(--red), var(--red-dark));
    color: white;
}

.usta-stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid #f0f0f0;
    gap: 10px;
}
.usta-stat-row:last-child { border-bottom: none; }
.usta-stat-name { font-weight: 700; font-size: 14px; }
.usta-stat-spec { font-size: 11px; color: var(--muted); margin-top: 2px; }
.usta-stat-amount { text-align: right; }
.usta-stat-money { color: var(--green); font-weight: 900; font-size: 15px; }
.usta-stat-count { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* МИЖОЗ КАРТАСИ */
.mijoz-card {
    border-left: 5px solid var(--blue);
}
.mijoz-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: 900;
    flex-shrink: 0;
}
.mijoz-info {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
}
.mijoz-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-top: 12px;
}
.mijoz-actions .btn {
    margin: 0;
    min-height: 42px;
    font-size: 13px;
    padding: 10px;
}

@media (max-width: 768px) {
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr; }
    .stats { grid-template-columns: 1fr 1fr; }
    .grid-form { grid-template-columns: 1fr; }
    .header-inner { flex-wrap: wrap; }
    .logo-svg { width: 100px; }
    .logo-box { padding: 5px 10px; }
    .logo-text h1 { font-size: 15px; }
    .live-clock { font-size: 12px; padding: 6px 12px; }
    nav { top: 68px; }
    nav button { font-size: 12px; padding: 12px 14px; }
}
@media (max-width: 480px) {
    .section { padding: 16px 14px; }
    .card { padding: 16px; }
    .logo-svg { width: 80px; }
    .logo-box { padding: 4px 8px; border-radius: 10px; }
    .logo-text h1 { font-size: 13px; }
    .stat-value { font-size: 18px; }
    .result-total { font-size: 18px; }
}
</style>
</head>
<body>

<div class="bg"></div>
<div class="toast" id="toast">Муваффақият!</div>

<header>
    <div class="header-inner">
        <div class="logo-wrap">
            <div class="logo-box">
                <svg class="logo-svg" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
                    <g fill="none" stroke="#e31e24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M 100 52 Q 140 28 210 26 Q 280 28 320 52"/>
                        <path d="M 88 62 Q 140 56 210 54 Q 280 56 332 62"/>
                        <ellipse cx="98" cy="60" rx="7" ry="5" stroke-width="2.5"/>
                        <ellipse cx="322" cy="60" rx="7" ry="5" stroke-width="2.5"/>
                    </g>

<script>
/* ============ SUPABASE ============ */
const SUPABASE_URL = 'https://nkrkhssusfljvbofuggj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nUNl6pakp9KDH3fWqUeSiQ_ZUoPHb0V';

let supabaseClient = null;
try {
    if (typeof window.supabase !== 'undefined' && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        console.log('✅ Supabase уланиш тайёр');
    }
} catch (e) {
    console.error('❌ Supabase хато:', e);
}

/* ============ DATA ============ */
let ustalar = [];
let orders = [];
let mijozlar = [];
let specs = ["МОТОР", "ХОДОВОЙ", "КУЗОВ", "ВАКУМ", "ЭЛЕКТРИК", "ДИАГНОСТИКА", "МЕХАНИК", "БОШҚА"];
let period = 'month';
let lastSms = null;

const $ = id => document.getElementById(id);
const money = n => Math.round(Number(n) || 0).toLocaleString('uz-UZ');

function toast(msg, isError) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast' + (isError ? ' error' : '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
}

function setSyncStatus(text, cls) {
    const el = $('syncStatus');
    if (!el) return;
    el.textContent = text;
    el.className = 'sync-status ' + (cls || '');
}

/* ============ SUPABASE ЮКЛАШ ============ */
async function loadFromSupabase() {
    if (!supabaseClient) {
        setSyncStatus('❌ Supabase уланмаган', 'err');
        return;
    }
    setSyncStatus('⏳ Юкланмоқда...', 'loading');
    try {
        const { data: uData, error: e1 } = await supabaseClient
            .from('ustalar').select('*').order('created_at', { ascending: true });
        if (e1) throw e1;
        ustalar = uData || [];

        const { data: oData, error: e3 } = await supabaseClient
            .from('orders').select('*').order('id', { ascending: false });
        if (e3) throw e3;
        orders = (oData || []).map(o => ({ ...o, dateStr: o.date_str || o.dateStr }));

        const { data: mData, error: e5 } = await supabaseClient
            .from('mijozlar').select('*').order('updated_at', { ascending: false });
        if (e5) throw e5;
        mijozlar = mData || [];

        const { data: spData, error: e4 } = await supabaseClient
            .from('specs').select('*').order('id', { ascending: true });
        if (e4) throw e4;
        if (spData && spData.length > 0) {
            specs = spData.map(s => s.name);
        }

        setSyncStatus('✅ Синхрон', 'ok');
        console.log('✅ Маълумотлар юкланди:', { 
            ustalar: ustalar.length, 
            orders: orders.length,
            mijozlar: mijozlar.length 
        });

        renderUstaSpecSelect();
        renderUstalar();
        renderOrderUstaSelect();
        renderHistory();
        renderDash();
        renderMijozlar();
    } catch (err) {
        console.error('❌ Supabase хато:', err);
        setSyncStatus('❌ Хато', 'err');
        toast('Маълумот юкланмади: ' + (err.message || ''), true);
    }
}

/* ============ СОАТ ============ */
function updateClock() {
    const now = new Date();
    const h = String(now.getHours()).padStart(2, '0');
    const m = String(now.getMinutes()).padStart(2, '0');
    const s = String(now.getSeconds()).padStart(2, '0');
    const el = $('clockText');
    if (el) el.textContent = `${h}:${m}:${s}`;
}
setInterval(updateClock, 1000);

/* ============ НАВИГАЦИЯ ============ */
function go(id, btn) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    $(id).classList.add('active');
    btn.classList.add('active');

    if (id === 's-panel') renderDash();
    if (id === 's-ustalar') { renderUstalar(); renderUstaSpecSelect(); }
    if (id === 's-order') renderOrderUstaSelect();
    if (id === 's-history') renderHistory();
    if (id === 's-mijozlar') renderMijozlar();

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ============ МУТАХАССИСЛИКЛАР ============ */
function renderUstaSpecSelect() {
    const el = $('ustaSpec');
    if (!el) return;
    el.innerHTML = '<option value="">-- Мутахассисликни танланг --</option>' +
        specs.map(s => `<option value="${s}">${s}</option>`).join('');
}

async function addNewSpec() {
    const name = $('newSpecName').value.trim().toUpperCase();
    if (!name) return toast('Мутахассислик номини киритинг', true);
    if (specs.includes(name)) return toast('Бу мутахассислик мавжуд', true);

    try {
        const { error } = await supabaseClient.from('specs').insert([{ name: name }]);
        if (error) throw error;
        specs.push(name);
        $('newSpecName').value = '';
        renderUstaSpecSelect();
        toast('Мутахассислик қўшилди');
    } catch (err) {
        console.error(err);
        toast('Хатолик: ' + err.message, true);
    }
}

/* ============ УСТАЛАР ============ */
async function addUsta() {
    const name = $('ustaName').value.trim();
    const spec = $('ustaSpec').value;

    if (!name) return toast('Уста исмини киритинг', true);
    if (!spec) return toast('Мутахассисликни танланг', true);

    const newUsta = { id: Date.now(), name: name, spec: spec };

    try {
        const { error } = await supabaseClient.from('ustalar').insert([newUsta]);
        if (error) throw error;

        ustalar.push(newUsta);
        $('ustaName').value = '';
        $('ustaSpec').value = '';

        renderUstalar();
        renderOrderUstaSelect();
        toast('Уста қўшилди');
    } catch (err) {
        console.error(err);
        toast('Сақлашда хатолик', true);
    }
}

async function delUsta(id) {
    if (!confirm('Устани ўчирмоқчимисиз?')) return;
    try {
        const { error } = await supabaseClient.from('ustalar').delete().eq('id', id);
        if (error) throw error;
        ustalar = ustalar.filter(u => u.id !== id);
        renderUstalar();
        renderOrderUstaSelect();
        toast('Ўчирилди');
    } catch (err) {
        console.error(err);
        toast('Хатолик', true);
    }
}

function renderUstalar() {
    const el = $('ustalarList');
    if (!el) return;
    $('ustalarCount').textContent = ustalar.length + ' та';

    if (ustalar.length === 0) {
        el.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div>Усталар йўқ</div></div>';
        return;
    }

    el.innerHTML = ustalar.map(u => `
        <div class="item">
            <div class="item-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <div class="item-body">
                <div class="item-title">${u.name}</div>
                <div class="item-sub">${u.spec}</div>
            </div>
            <button class="item-del" onclick="delUsta(${u.id})">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
        </div>
    `).join('');
}

/* ============ МИЖОЗ ============ */
function renderOrderUstaSelect() {
    const el = $('oUsta');
    if (!el) return;
    el.innerHTML = '<option value="">-- Устани танланг --</option>' +
        ustalar.map(u => `<option value="${u.name}|${u.spec}">${u.name} — ${u.spec}</option>`).join('');
}

function calcOrder() {
    const name = $('oName').value.trim();
    const phone = $('oPhone').value.trim();
    const model = $('oModel').value.trim();
    const number = $('oNumber').value.trim();
    const ustaVal = $('oUsta').value;
    const dagavor = Number($('oDagavor').value);

    if (!name) return toast('Мижоз исмини киритинг', true);
    if (!phone) return toast('Телефон рақамини киритинг', true);
    if (!model) return toast('Автомобиль моделини киритинг', true);
    if (!number) return toast('Автомобиль рақамини киритинг', true);
    if (!ustaVal) return toast('Устани танланг', true);
    if (!dagavor || dagavor <= 0) return toast('Дагавор суммани киритинг', true);

    const [ustaName, ustaSpec] = ustaVal.split('|');
    const mgr = dagavor * 0.30;
    const ust = dagavor * 0.70;

    const el = $('orderResult');
    el.innerHTML = `

            <div class="result-info">
                <div><span>Мижоз</span><strong>${name}</strong></div>

                <div><span>Автомобиль</span><strong>${model} — ${number}</strong></div>
                <div><span>Уста</span><strong>${ustaName} (${ustaSpec})</strong></div>
            </div>
            <div class="result-total">
                <span>ЖАМИ</span>
                <span>${money(dagavor)} сўм</span>
            </div>
            <div class="result-share">
                <div class="share-box m">
                    <div class="share-label">МЕНЕЖЕР 30%</div>
                    <div class="share-value">${money(mgr)}</div>
                </div>
                <div class="share-box u">
                    <div class="share-label">УСТА 70%</div>
                    <div class="share-value">${money(ust)}</div>
                </div>
            </div>
            <button class="btn green" style="margin-top:14px" onclick='saveOrder(${JSON.stringify({name, phone, model, number, ustaName, ustaSpec, dagavor, mgr, ust}).replace(/'/g, "&#39;")})'>

                Сақлаш ва SMS юбориш

}

async function saveOrder(data) {
    const now = new Date();
    const order = {
        id: Date.now(),
        date: now.toLocaleString('uz-UZ'),
        date_str: now.toISOString().split('T')[0],
        name: data.name,
        phone: data.phone,
        model: data.model,
        number: data.number,
        dagavor: data.dagavor,
        total: data.dagavor,
        mgr: data.mgr,
        ust: data.ust,
        usta_name: data.ustaName,
        usta_spec: data.ustaSpec
    };

    try {
        const { error } = await supabaseClient.from('orders').insert([order]);
        if (error) throw error;

        orders.unshift({...order, dateStr: order.date_str});

        // МИЖОЗНИ БАЗАГА ҚЎШИШ ЁКИ ЯНГИЛАШ
        await saveMijoz(data);

        const smsText = `ҲУРМАТЛИ ${data.name.toUpperCase()}!\n\nСИЗНИНГ ${data.number} ${data.model.toUpperCase()} РУСУМЛИ АВТОМОБИЛИНГИЗГА КЎРСАТИЛГАН ХИЗМАТЛАР ${money(data.dagavor)} СЎМ БЎЛДИ.\n\nХИЗМАТИМИЗДАН ФОЙДАЛАНГАНИНГИЗ УЧУН МИННАТДОРМИЗ!`;

        lastSms = { phone: data.phone, text: smsText };
        $('smsTo').textContent = data.name;
        $('smsPhone').textContent = data.phone;
        $('smsText').textContent = smsText;
        $('smsModal').classList.add('show');

        $('oName').value = '';
        $('oPhone').value = '';
        $('oModel').value = '';
        $('oNumber').value = '';
        $('oUsta').value = '';
        $('oDagavor').value = '';
        $('orderResult').innerHTML = '';
    } catch (err) {
        console.error(err);
        toast('Сақлашда хатолик: ' + err.message, true);
    }
}

/* ============ МИЖОЗНИ САҚЛАШ/ЯНГИЛАШ ============ */
async function saveMijoz(data) {
    try {
        // Телефон рақами бўйича мавжуд мижозни қидириш
        const existing = mijozlar.find(m => m.phone === data.phone);

        if (existing) {
            // Мавжуд мижозни янгилаш
            const newTotal = Number(existing.total_spent || 0) + data.dagavor;
            const newCount = Number(existing.orders_count || 0) + 1;

            const { error } = await supabaseClient.from('mijozlar')
                .update({
                    name: data.name,
                    model: data.model,
                    number: data.number,
                    total_spent: newTotal,
                    orders_count: newCount,
                    updated_at: new Date().toISOString()
                })
                .eq('id', existing.id);

            if (error) throw error;

            existing.name = data.name;
            existing.model = data.model;
            existing.number = data.number;
            existing.total_spent = newTotal;
            existing.orders_count = newCount;
        } else {
            // Янги мижоз яратиш
            const newMijoz = {
                id: Date.now(),
                name: data.name,
                phone: data.phone,
                model: data.model,
                number: data.number,
                total_spent: data.dagavor,
                orders_count: 1
            };

            const { error } = await supabaseClient.from('mijozlar').insert([newMijoz]);
            if (error) throw error;

            mijozlar.unshift(newMijoz);
        }

        renderMijozlar();
    } catch (err) {
        console.error('Мижоз сақлашда хато:', err);
    }
}

                <div class="mijoz-actions">

function callMijoz(phone) {
    if (!phone) return;
    const clean = phone.replace(/[^\d+]/g, '');
    window.location.href = `tel:${clean}`;
}

function showMijozDetails(phone) {
    const m = mijozlar.find(x => x.phone === phone);
    if (!m) return;
    const clientOrders = orders.filter(o => o.phone === phone);
    let text = `👤 ${m.name}\n📞 ${m.phone}\n🚗 ${m.model} — ${m.number}\n\n`;
    text += `📦 Буюртмалар: ${m.orders_count} та\n`;
    text += `💰 Жами тўлов: ${money(m.total_spent)} сўм\n`;
    if (clientOrders.length > 0) {
        text += `\n📅 Охирги буюртма: ${clientOrders[0].date}`;
    }
    alert(text);
}

/* ============ SMS ============ */
function closeSms() { $('smsModal').classList.remove('show'); }

function sendSms() {
    if (!lastSms) return;
    const clean = lastSms.phone.replace(/[^\d+]/g, '');
    window.location.href = `sms:${clean}?body=${encodeURIComponent(lastSms.text)}`;
    toast('SMS илова очилмоқда...');
    setTimeout(() => {
        closeSms();
        go('s-mijozlar', document.querySelectorAll('nav button')[2]);
    }, 700);
}

/* ============ ПАНЕЛ ============ */
function setPeriod(p) {
    period = p;
    ['today', 'week', 'month', 'all'].forEach(x => {
        const btn = $('p-' + x);
        if (btn) btn.classList.toggle('active', x === p);
    });
    renderDash();
}

function getFiltered() {
    const today = new Date();
    const todayStr = today.toISOString().split('T')[0];

    if (period === 'today') return orders.filter(o => o.dateStr === todayStr);
    if (period === 'week') {
        const d = new Date(today);
        d.setDate(d.getDate() - 7);
        return orders.filter(o => o.dateStr >= d.toISOString().split('T')[0]);
    }
    if (period === 'month') {
        const d = new Date(today);
        d.setDate(d.getDate() - 30);
        return orders.filter(o => o.dateStr >= d.toISOString().split('T')[0]);
    }
    return orders;
}

    const total = f.reduce((s, o) => s + Number(o.dagavor || 0), 0);
    const mgr = f.reduce((s, o) => s + Number(o.mgr || 0), 0);
    const ust = f.reduce((s, o) => s + Number(o.ust || 0), 0);

    const periodNames = { today: 'Бугун', week: 'Охирги 7 кун', month: 'Охирги 30 кун', all: 'Барча вақт' };
    $('periodText').textContent = periodNames[period];

    $('dashStats').innerHTML = `
        <div class="stats">
            <div class="stat red">
                <div class="stat-label">Умумий тушум</div>

            <div class="stat blue">
                <div class="stat-label">Менежер 30%</div>

        </div>
    `;

    const ustaMap = {};
    f.forEach(o => {
        const key = o.usta_name || 'Номаълум';
        if (!ustaMap[key]) ustaMap[key] = { spec: o.usta_spec || '', count: 0, total: 0, share: 0 };
        ustaMap[key].count++;
        ustaMap[key].total += Number(o.dagavor || 0);
        ustaMap[key].share += Number(o.ust || 0);
    });

    const entries = Object.entries(ustaMap).sort((a, b) => b[1].share - a[1].share);

    let html = '<h2 style="margin-top:24px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Усталар иш ҳаққи</h2>';

    if (entries.length === 0) {
        html += '<div class="card"><div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><div>Маълумот йўқ</div></div></div>';

        html += '<div class="card">';

    html += `
        <div class="card">
            <div class="usta-stat-row">
                <div>
                    <div class="usta-stat-name">💼 Менежер</div>
                    <div class="usta-stat-spec">${f.length} та буюртмадан 30%</div>
                </div>
                <div class="usta-stat-amount">

async function delOrder(id) {
    if (!confirm('Ўчирмоқчимисиз?')) return;
    try {
        const { error } = await supabaseClient.from('orders').delete().eq('id', id);
        if (error) throw error;
        orders = orders.filter(o => o.id !== id);
        renderHistory();
        renderDash();
        toast('Ўчирилди');
    } catch (err) {
        console.error(err);
        toast('Хатолик', true);
    }
}

function resendSms(id) {
    const o = orders.find(x => x.id === id);
    if (!o) return;
    const smsText = `ҲУРМАТЛИ ${(o.name || 'МИЖОЗ').toUpperCase()}!\n\nСИЗНИНГ ${o.number || ''} ${(o.model || '').toUpperCase()} РУСУМЛИ АВТОМОБИЛИНГИЗГА КЎРСАТИЛГАН ХИЗМАТЛАР ${money(o.dagavor || o.total)} СЎМ БЎЛДИ.\n\nХИЗМАТИМИЗДАН ФОЙДАЛАНГАНИНГИЗ УЧУН МИННАТДОРМИЗ!`;
    lastSms = { phone: o.phone, text: smsText };
    $('smsTo').textContent = o.name;
    $('smsPhone').textContent = o.phone;
    $('smsText').textContent = smsText;
    $('smsModal').classList.add('show');
}
